[package]
name = "game_installer"
version = "0.1.0"
edition = "2024"
description = "Fonketh install wizard: downloads a release from GitHub and sets the game up"

[[bin]]
name = "fonketh-installer"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
console = "0.15"
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
dirs = "6"
flate2 = "1"
hex = "0.4"
indicatif = "0.17"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.50"
